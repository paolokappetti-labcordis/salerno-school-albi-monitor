name: Monitor giornaliero albi scuole Salerno

on:
  schedule:
    # Ogni giorno alle 06:15 UTC (07:15 o 08:15 in Italia, secondo l'ora legale).
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salerno-school-albi-daily
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check school boards
        run: node monitor-school-albi.mjs
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school-albi-state.json
          if git diff --cached --quiet; then
            echo "State unchanged"
          else
            git commit -m "Update school board monitor state"
            git pull --rebase
            git push
          fi
